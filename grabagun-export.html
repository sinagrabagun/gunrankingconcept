const list = document.getElementById('list'), st = document.getElementById('st');
ITEMS.forEach((it, i) => { const w = document.createElement('div'); w.className = 'g'; w.innerHTML = '<span>' + it.name + '</span>' + it.html; w.children[1].id = 'f' + i; list.appendChild(w); });
const imgs = [...list.querySelectorAll('img')]; let busy = false, ok = 0, bad = 0;
const BASE = /(^|\.)gunranking\.com$/.test(location.hostname) ? '' : 'https://gunranking.com';
imgs.forEach(im => { im.dataset.src = BASE + im.getAttribute('src') + '&x=1'; im.removeAttribute('src'); im.crossOrigin = 'anonymous'; });
const tick = () => { if (!busy) st.textContent = ok + ' / ' + imgs.length + ' photos loaded' + (bad ? ' · ' + bad + ' failed' : '') + (ok + bad < imgs.length ? '. First load copies each photo from GrabAGun, so this can take a few minutes. Keep this tab open.' : '. Ready: press the button.'); };
const load1 = (im, n) => new Promise(res => { const t = setTimeout(() => done(false), 45000);
  const done = good => { clearTimeout(t); im.onload = im.onerror = null; res(good); };
  im.onload = () => done(!!im.naturalWidth); im.onerror = () => done(false);
  if (n) im.removeAttribute('src');
  im.src = im.dataset.src + (n ? '&r=' + n : ''); });
const q = imgs.slice();
const worker = async () => { while (q.length) { const im = q.shift(); let good = false;
  for (let n = 0; n < 3 && !good; n++) good = await load1(im, n);
  good ? ok++ : bad++; tick(); } };
Promise.all(Array.from({ length: 6 }, worker)); tick();
document.getElementById('go').onclick = async function () {
  this.disabled = true; busy = true; await document.fonts.ready;
  const css = document.getElementById('fonts').textContent; await Promise.all([document.fonts.load("800 100px 'Barlow Condensed'"), document.fonts.load("800 20px 'Manrope'")]);
  const zip = new JSZip(); const dir = zip.folder('grabagun-duels');
  for (let i = 0; i < ITEMS.length; i++) { st.textContent = 'Rendering ' + (i + 1) + ' / ' + ITEMS.length + ' · ' + ITEMS[i].name;
    const n = document.getElementById('f' + i);
    n.querySelectorAll('img').forEach(im => { if (!(im.complete && im.naturalWidth)) im.style.visibility = 'hidden'; });
    const url = await Promise.race([htmlToImage.toJpeg(n, { width: 1200, height: 1600, pixelRatio: 1, quality: 0.93, backgroundColor: '#0B0B0B', cacheBust: false, fontEmbedCSS: css || undefined, imagePlaceholder: 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' }), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 60000))]).catch(e => { console.warn(ITEMS[i].name, e); return null; });
    if (!url) continue;
    dir.file(ITEMS[i].name, url.split(',')[1], { base64: true }); }
  st.textContent = 'Zipping…'; const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(z); a.download = 'grabagun-duels.zip'; a.click();
  busy = false; st.textContent = 'Done. ' + ITEMS.length + ' JPGs at 1200×1600.' + (bad ? ' ' + bad + ' photos had failed; reload the page and export again to retry them.' : ''); this.disabled = false; };
